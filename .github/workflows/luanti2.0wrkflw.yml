name: Build Patched Ultra Luanti (Win64 & Linux64)

on:
  workflow_dispatch:

jobs:
  # ========================================================
  # WINDOWS 64-BIT (Vollständig portabel mit allen DLLs)
  # ========================================================
  build-windows-64:
    runs-on: windows-latest
    steps:
      - name: Checkout Luanti Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Commit b4c7335 & Apply Patch
        shell: bash
        run: |
          git checkout b4c7335
          if [ -f "luanti-terrain-lod.patch" ]; then
            git apply --ignore-whitespace --ignore-space-change luanti-terrain-lod.patch || git apply -3 luanti-terrain-lod.patch
          fi

      - name: Setup MSYS2 CLANG64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-libzip
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-SDL2
            mingw-w64-clang-x86_64-luajit
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-openal
            mingw-w64-clang-x86_64-libvorbis
            mingw-w64-clang-x86_64-libogg
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-curl
            mingw-w64-clang-x86_64-freetype
            mingw-w64-clang-x86_64-gmp
            mingw-w64-clang-x86_64-gettext

      - name: Ensure IrrlichtMt Source Exists
        shell: bash
        run: |
          if [ ! -d "irr" ] && [ ! -d "lib/irrlichtmt" ]; then
            git clone --depth 1 https://github.com/minetest/irrlicht.git lib/irrlichtmt
          fi

      - name: Add Distant Horizons Config
        shell: bash
        run: |
          cat << 'EOF' > minetest.conf
          viewing_range = 5000
          max_block_send_distance = 64
          max_block_generate_distance = 64
          client_mesh_generation_threads = 8
          mesh_generation_interval = 0
          enable_shaders = false
          enable_dynamic_shadows = false
          leaves_style = opaque
          smooth_lighting = false
          occlusion_culler = cull_cells
          fps_max = 144
          EOF

      - name: Compile Windows 64-Bit mit Clang (-O3)
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3" \
            -DCMAKE_C_FLAGS="-O3" \
            -DENABLE_POSTGRESQL=FALSE \
            -DENABLE_REDIS=FALSE \
            -DENABLE_LEVELDB=FALSE \
            -DENABLE_SPATIAL=FALSE \
            -DBUILD_UNITTESTS=FALSE \
            -DBUILD_DOCUMENTATION=FALSE \
            -DRUN_IN_PLACE=TRUE
          ninja

      - name: Package Complete Portable Windows 64-Bit ZIP
        shell: msys2 {0} # WICHTIG: läuft in MSYS2, damit /clang64/bin/ existiert!
        run: |
          mkdir -p dist/bin dist/builtin dist/games
          
          # 1. Programm & Config kopieren
          cp bin/luanti.exe dist/bin/
          cp minetest.conf dist/
          
          # 2. Basis-Dateien & Assets kopieren
          cp -r builtin/* dist/builtin/
          cp -r textures dist/ 2>/dev/null || true
          cp -r client dist/ 2>/dev/null || true
          cp -r locale dist/ 2>/dev/null || true
          cp -r fonts dist/ 2>/dev/null || true
          
          # 3. Minetest Game bereitstellen, damit man direkt Welten erstellen kann
          git clone --depth 1 https://github.com/minetest/minetest_game.git dist/games/minetest_game
          
          # 4. Alle Laufzeit-DLLs direkt neben luanti.exe kopieren
          echo "Kopiere alle benötigten Windows-DLLs..."
          cp /clang64/bin/*.dll dist/bin/
          
          echo "Fertig gepackt! Inhalt von dist/bin:"
          ls -lh dist/bin/

      - name: Upload Windows 64-Bit ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-LOD-Windows-64bit
          path: dist/

  # ========================================================
  # LINUX 64-BIT (mit Terrain-LOD-Patch)
  # ========================================================
  build-linux-64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Luanti Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Commit b4c7335 & Apply Patch
        run: |
          git checkout b4c7335
          if [ -f "luanti-terrain-lod.patch" ]; then
            git apply --ignore-whitespace --ignore-space-change luanti-terrain-lod.patch || git apply -3 luanti-terrain-lod.patch
          fi

      - name: Install All Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git gettext \
            libsdl2-dev zlib1g-dev libzip-dev libzstd-dev libluajit-5.1-dev libsqlite3-dev \
            libopenal-dev libvorbis-dev libogg-dev libjpeg-dev libpng-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxi-dev \
            libxxf86vm-dev libcurl4-openssl-dev libfreetype-dev libgmp-dev

      - name: Ensure IrrlichtMt Source Exists
        run: |
          if [ ! -d "irr" ] && [ ! -d "lib/irrlichtmt" ]; then
            git clone --depth 1 https://github.com/minetest/irrlicht.git lib/irrlichtmt
          fi

      - name: Add Distant Horizons Config
        run: |
          cat << 'EOF' > minetest.conf
          viewing_range = 5000
          max_block_send_distance = 64
          max_block_generate_distance = 64
          client_mesh_generation_threads = 8
          mesh_generation_interval = 0
          enable_shaders = false
          enable_dynamic_shadows = false
          leaves_style = opaque
          smooth_lighting = false
          occlusion_culler = cull_cells
          fps_max = 144
          EOF

      - name: Compile Linux 64-Bit (-O3)
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64-v2" \
            -DCMAKE_C_FLAGS="-O3 -march=x86-64-v2" \
            -DENABLE_POSTGRESQL=FALSE \
            -DBUILD_UNITTESTS=FALSE \
            -DBUILD_DOCUMENTATION=FALSE \
            -DRUN_IN_PLACE=TRUE
          ninja
          cd ..
          mkdir -p dist/bin dist/builtin dist/games
          cp -r bin/* dist/bin/
          cp -r builtin/* dist/builtin/
          cp -r textures dist/ 2>/dev/null || true
          cp -r client dist/ 2>/dev/null || true
          git clone --depth 1 https://github.com/minetest/minetest_game.git dist/games/minetest_game
          cp minetest.conf dist/

      - name: Upload Linux 64-Bit ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-LOD-Linux-64bit
          path: dist/
