name: Build All 4 ZIPs (Ultra Optimized)

on:
  workflow_dispatch: # Ermöglicht manuellen Start per Klick

jobs:
  # ========================================================
  # WINDOWS BUILDS (64-BIT & 32-BIT)
  # ========================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            out_name: Luanti-Ultra-Windows-64bit
          - arch: i686
            msystem: MINGW32
            prefix: mingw-w64-i686
            out_name: Luanti-Ultra-Windows-32bit
    steps:
      - name: Checkout Luanti Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 (${{ matrix.arch }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            git
            ninja
            cmake
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-libirrlichtmt
            ${{ matrix.prefix }}-zstd
            ${{ matrix.prefix }}-luajit
            ${{ matrix.prefix }}-sqlite3
            ${{ matrix.prefix }}-openal
            ${{ matrix.prefix }}-libvorbis

      - name: Apply Distant Horizons & Sodium Optimization Patch
        shell: bash
        run: |
          # Optimierte minetest.conf direkt beilegen
          cat << 'EOF' > minetest.conf
          viewing_range = 5000
          max_block_send_distance = 64
          max_block_generate_distance = 64
          client_mesh_generation_threads = 8
          mesh_generation_interval = 0
          enable_shaders = false
          enable_dynamic_shadows = false
          leaves_style = opaque
          smooth_lighting = false
          occlusion_culler = cull_cells
          fps_max = 144
          EOF

      - name: Build with Ultra Flags (-O3, LTO)
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -flto -ffast-math" \
            -DCMAKE_C_FLAGS="-O3 -flto -ffast-math" \
            -DRUN_IN_PLACE=TRUE
          ninja

      - name: Prepare Windows Package
        shell: bash
        run: |
          mkdir -p dist/
          cp -r bin dist/
          cp -r builtin dist/
          cp -r games dist/ 2>/dev/null || true
          cp minetest.conf dist/
          # Kopiere benötigte DLLs
          cp /${{ matrix.msystem }}/bin/*.dll dist/bin/ 2>/dev/null || true

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/

  # ========================================================
  # LINUX 64-BIT BUILD
  # ========================================================
  build-linux-64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libirrlichtmt-dev libluajit-5.1-dev libzstd-dev libsqlite3-dev \
            libopenal-dev libvorbis-dev

      - name: Build Linux 64-Bit Optimized
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -flto -march=x86-64-v2 -ffast-math" \
            -DRUN_IN_PLACE=TRUE
          ninja
          cd ..
          mkdir -p dist
          cp -r bin dist/
          cp -r builtin dist/

      - name: Upload Linux 64-Bit ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-Ultra-Linux-64bit
          path: dist/

  # ========================================================
  # LINUX 32-BIT BUILD (via i386 Docker Container)
  # ========================================================
  build-linux-32:
    runs-on: ubuntu-latest
    container:
      image: i386/ubuntu:22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 32-Bit Toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build git \
            libirrlichtmt-dev libluajit-5.1-dev libzstd-dev libsqlite3-dev \
            libopenal-dev libvorbis-dev

      - name: Build Linux 32-Bit Optimized
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -m32 -march=i686 -ffast-math" \
            -DCMAKE_C_FLAGS="-O3 -m32 -march=i686 -ffast-math" \
            -DRUN_IN_PLACE=TRUE
          ninja
          cd ..
          mkdir -p dist
          cp -r bin dist/
          cp -r builtin dist/

      - name: Upload Linux 32-Bit ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-Ultra-Linux-32bit
          path: dist/
